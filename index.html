<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#f2e6db">
  <meta name="description" content="Catálogo interactivo LEVÁRIA, con efecto de paso de página y zoom.">
  <title>LEVÁRIA | Catálogo interactivo</title>
  <link rel="icon" type="image/png" href="./levaria-favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script defer src="pages.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="catalog" aria-label="Catálogo interactivo LEVÁRIA">
    <section id="viewer" class="viewer" aria-label="Página del catálogo">
      <div id="stage" class="stage">
        <div id="under" class="leaf under" aria-hidden="true"><img id="under-img" alt=""></div>
        <div id="over" class="leaf over"><img id="over-img" alt=""></div>
      </div>
      <div id="status" class="status" role="alert" hidden></div>
    </section>
    <nav class="controls" aria-label="Navegación del catálogo">
      <div class="control-cluster">
        <button id="prev" type="button" aria-label="Página anterior">← <span>Anterior</span></button>
        <output id="counter" aria-live="polite">1 / 11</output>
        <button id="next" type="button" aria-label="Página siguiente"><span>Siguiente</span> →</button>
      </div>
      <div class="control-cluster zoom-tools">
        <button id="zoom-out" type="button" aria-label="Alejar">−</button>
        <output id="zoom-level" aria-label="Nivel de ampliación">100 %</output>
        <button id="zoom-in" type="button" aria-label="Acercar">+</button>
        <button id="fit" type="button">Ajustar</button>
        <select id="jump" aria-label="Seleccionar página"></select>
      </div>
    </nav>
  </main>
</body>
</html>
